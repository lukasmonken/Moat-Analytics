name: CI e GitHub Pages

on:
  push:
  pull_request:
  schedule:
    - cron: '17 7 * * 2'
      timezone: America/Sao_Paulo
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar no GitHub Pages
        type: boolean
        default: false

permissions: {}

concurrency:
  group: >-
    ${{ github.ref == 'refs/heads/main' &&
    (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publicar)) &&
    'github-pages-build' || format('ci-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validar o site
    if: >-
      github.event_name != 'schedule' ||
      (github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      pages_artifact: ${{ steps.artifact.outputs.artifact_id }}
      annual_artifact: ${{ steps.annual_artifact.outputs.artifact-id }}
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Atualizar dados anuais da CVM
        if: github.event_name == 'schedule'
        run: python3 apps/pipeline/run_annual_refresh.py --output-dir data/public
      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Configurar npm
        run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - name: Instalar dependências
        run: npm ci
      - name: Rodar lint
        run: npm run lint
      - name: Conferir formatação
        run: npm run format:check
      - name: Verificar tipos
        run: npm run typecheck
      - name: Rodar testes do pipeline offline
        run: python3 -m unittest discover -s tests/pipeline
      - name: Rodar testes de integração
        run: npm test
      - name: Gerar build de produção
        run: npm run build
      - name: Instalar Chromium para Playwright
        run: npm exec -- playwright install --with-deps chromium
      - name: Testar no navegador
        run: npm run test:e2e
      - name: Guardar os indicadores anuais validados
        id: annual_artifact
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: annual-cvm-data-${{ github.run_attempt }}
          path: |
            data/public/cvm-sector-comparison.json
            data/public/cvm-sector-roic.json
            data/public/cvm-sector-margins.json
            data/public/cvm-sector-leverage.json
            data/public/cvm-sector-reinvestment.json
          if-no-files-found: error
      - name: Enviar artefato do GitHub Pages
        id: artifact
        if: >-
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publicar)) &&
          github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  persist_annual:
    name: Gravar indicadores anuais no repositório
    needs: validate
    if: >-
      github.event_name == 'schedule' && needs.validate.outputs.annual_artifact != '' &&
      github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Obter a revisão validada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Baixar os indicadores validados
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.annual_artifact }}
          path: ${{ runner.temp }}/annual-cvm-data
      - name: Registrar somente os lotes anuais
        run: |
          remote_revision=$(git ls-remote --exit-code origin refs/heads/main | cut -f 1)
          if [ "$remote_revision" != "$GITHUB_SHA" ]; then
            echo '::error::A branch main avançou durante a validação dos indicadores anuais.'
            exit 1
          fi
          for indicator in comparison roic margins leverage reinvestment; do
            snapshot="cvm-sector-${indicator}.json"
            cp -- "$RUNNER_TEMP/annual-cvm-data/$snapshot" "data/public/$snapshot"
            git add -- "data/public/$snapshot"
          done
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: atualizar indicadores anuais da CVM'
          git push origin HEAD:refs/heads/main

  deploy:
    name: Publicar no GitHub Pages
    needs: [validate, persist_annual]
    if: >-
      always() && needs.validate.result == 'success' && needs.validate.outputs.pages_artifact != '' &&
      ((github.event_name == 'schedule' && needs.persist_annual.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.publicar))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefato validado
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
